<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #1a202c;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 480px;
      padding: 32px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 span { font-size: 1.8rem; }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    .input-row input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row button {
      padding: 10px 18px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #5a67d8; }
    .input-row button:disabled { background: #a0aec0; cursor: not-allowed; }

    .stats {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 12px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      transition: opacity 0.2s, background 0.2s;
    }

    li.done {
      background: #f0fff4;
      border-color: #c6f6d5;
      opacity: 0.7;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #48bb78;
      flex-shrink: 0;
    }

    li .name {
      flex: 1;
      font-size: 1rem;
      word-break: break-all;
    }

    li.done .name {
      text-decoration: line-through;
      color: #a0aec0;
    }

    li button.del {
      background: none;
      border: none;
      cursor: pointer;
      color: #cbd5e0;
      font-size: 1.2rem;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }

    li button.del:hover { color: #e53e3e; background: #fff5f5; }

    .empty {
      text-align: center;
      padding: 32px 0;
      color: #a0aec0;
      font-size: 0.95rem;
    }

    .clear-btn {
      margin-top: 20px;
      width: 100%;
      padding: 9px;
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #718096;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .clear-btn:hover { background: #fff5f5; color: #e53e3e; border-color: #fed7d7; }

    .loading {
      text-align: center;
      padding: 32px 0;
      color: #a0aec0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
<div class="card">
  <h1><span>🛒</span> 쇼핑 리스트</h1>

  <div class="input-row">
    <input id="itemInput" type="text" placeholder="아이템 입력..." />
    <button id="addBtn">추가</button>
  </div>

  <div class="stats" id="stats"></div>
  <ul id="list"></ul>
  <div class="loading" id="loading">불러오는 중...</div>
  <div class="empty" id="empty" style="display:none">아직 아이템이 없어요. 추가해 보세요!</div>
  <button class="clear-btn" id="clearBtn" style="display:none">완료 항목 모두 삭제</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://onvktwxmitoriynpqqbo.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9udmt0d3htaXRvcml5bnBxcWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyMjI1OTQsImV4cCI6MjA5NDc5ODU5NH0.Hn4fBIpt7oH2PYcuwswZ8qDlAaxlnyTWN4XXuLUO96M';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const input     = document.getElementById('itemInput');
  const addBtn    = document.getElementById('addBtn');
  const listEl    = document.getElementById('list');
  const emptyEl   = document.getElementById('empty');
  const statsEl   = document.getElementById('stats');
  const clearBtn  = document.getElementById('clearBtn');
  const loadingEl = document.getElementById('loading');

  let items = [];

  function render() {
    loadingEl.style.display = 'none';
    listEl.innerHTML = '';

    items.forEach(item => {
      const li = document.createElement('li');
      if (item.done) li.classList.add('done');

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = item.done;
      cb.addEventListener('change', () => toggleDone(item.id, cb.checked));

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.text;

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '삭제';
      del.addEventListener('click', () => deleteItem(item.id));

      li.append(cb, name, del);
      listEl.appendChild(li);
    });

    const total = items.length;
    const done  = items.filter(i => i.done).length;
    emptyEl.style.display  = total === 0 ? 'block' : 'none';
    clearBtn.style.display = done > 0 ? 'block' : 'none';
    statsEl.textContent    = total > 0 ? `총 ${total}개 · 완료 ${done}개 · 남은 ${total - done}개` : '';
  }

  async function loadItems() {
    const { data, error } = await db
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return; }
    items = data;
    render();
  }

  async function addItem() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    addBtn.disabled = true;
    const { data, error } = await db
      .from('shopping_items')
      .insert({ text, done: false })
      .select()
      .single();
    addBtn.disabled = false;
    if (error) { console.error(error); return; }
    items.unshift(data);
    input.value = '';
    render();
    input.focus();
  }

  async function toggleDone(id, done) {
    const { error } = await db
      .from('shopping_items')
      .update({ done })
      .eq('id', id);
    if (error) { console.error(error); return; }
    const item = items.find(i => i.id === id);
    if (item) item.done = done;
    render();
  }

  async function deleteItem(id) {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('id', id);
    if (error) { console.error(error); return; }
    items = items.filter(i => i.id !== id);
    render();
  }

  async function clearDone() {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('done', true);
    if (error) { console.error(error); return; }
    items = items.filter(i => !i.done);
    render();
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) addItem(); });
  clearBtn.addEventListener('click', clearDone);

  loadItems();
</script>
</body>
</html>
